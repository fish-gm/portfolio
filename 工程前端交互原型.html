<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>工程管理系统</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#4c63f5;--blue-d:#3d52dd;--blue-l:#eef1ff;--th:#eef2fb;
  --border:#e5e9f2;--line:#eef1f6;--bg:#f4f6fa;--label:#f7f8fa;
  --t:#333940;--t2:#5c6472;--m:#939bab;
  --green:#3aa76c;--green-bg:#e9f7ee;
  --red:#e35c53;--red-bg:#feecea;
  --orange:#e08b25;--orange-bg:#fff2e0;
  --yellow:#d19a00;--gray:#8a93a5;--gray-bg:#f1f3f6;
  --purple:#6a5ae0;
}
html,body{height:100%}
body{font:13px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--t);background:var(--bg);overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:12.5px;color:inherit;outline:none}
button{cursor:pointer}
a{color:var(--blue);text-decoration:none;cursor:pointer}
.ic{width:15px;height:15px;flex:none;vertical-align:-3px;color:#4a5060}

.app{display:flex;height:100vh}
.sidebar{width:200px;flex:none;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column}
.logo{height:48px;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--border);font-size:14px;font-weight:600;white-space:nowrap}
.logo-mark{width:20px;height:20px;border-radius:3px;background:linear-gradient(135deg,#4c63f5,#7f8fff);display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700}
.logo-fold{margin-left:auto;color:#6a7280;font-size:15px;cursor:pointer}
.sb-scroll{flex:1;overflow-y:auto;padding:8px 0 16px}
.sb-item{height:36px;display:flex;align-items:center;gap:9px;padding:0 14px;color:#3c424c;cursor:pointer;white-space:nowrap;font-size:12.5px}
.sb-item:hover{background:#f7f9ff;color:var(--blue)}
.sb-item.on{color:var(--blue);background:#f4f6ff;font-weight:600;position:relative}
.sb-item.on:before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;background:var(--blue)}
.sb-item.grp{font-weight:600;color:#39404b}
.sb-item .arw{margin-left:auto;color:#9aa2b1;font-size:10px}
.sb-item .badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;line-height:15px;height:15px;min-width:15px;padding:0 4px;border-radius:8px;text-align:center;font-weight:600}
.sb-sub .sb-item{padding-left:32px;height:32px;font-size:12.5px;color:#545b66}
.sb-sub .sb-item.on{color:var(--blue)}

.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:48px;flex:none;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:14px}
.crumb{font-size:12px;color:#9aa2b1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:#5c6472;font-weight:500}
.crumb span{margin:0 6px;color:#c9cfdb}
.top-right{margin-left:auto;display:flex;align-items:center;gap:15px;color:#4a5060;font-size:12.5px}
.top-right .ico{display:flex;align-items:center;position:relative;cursor:pointer}
.top-right .ico:hover{color:var(--blue)}
.top-right .tri{width:20px;height:20px;border-radius:3px;background:linear-gradient(135deg,#4c63f5,#57c2a8);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:9px;font-weight:700}
.dot-n{position:absolute;top:-5px;right:-7px;background:var(--red);color:#fff;font-size:9px;min-width:14px;height:14px;line-height:14px;border-radius:7px;text-align:center}

.tabbar{height:36px;flex:none;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:flex-end;padding:0 14px;gap:5px;overflow:hidden}
.tab{height:28px;display:flex;align-items:center;gap:6px;padding:0 9px;border:1px solid var(--border);border-bottom:none;border-radius:4px 4px 0 0;background:#fafbfe;color:#5c6472;font-size:12px;white-space:nowrap;cursor:pointer;max-width:165px;overflow:hidden}
.tab .tx{overflow:hidden;text-overflow:ellipsis}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.tab .mk{font-size:10px}
.tab .x{font-size:13px;line-height:1;opacity:.65;padding:0 1px}
.tab .x:hover{opacity:1}
.tab.fixed .x{display:none}
.tab-tools{margin-left:auto;padding-bottom:6px;font-size:11.5px;color:#9aa2b1;white-space:nowrap}

.content{flex:1;overflow-y:auto;padding:12px 14px 26px}
.page{background:#fff;border:1px solid var(--border);border-radius:3px;padding:16px 18px 20px;min-height:calc(100% - 4px)}

.page-hd{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.page-hd h2{font-size:16px;font-weight:600}
.page-hd .sub{font-size:12px;color:var(--m);margin-top:2px}
.page-hd .right{margin-left:auto;display:flex;gap:8px;align-items:center}

.sec{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin:18px 0 10px}
.sec:before{content:"";width:3px;height:14px;background:var(--blue);border-radius:1px}
.sec .right{margin-left:auto;font-size:12px;font-weight:400;display:flex;gap:8px;align-items:center}
.sec .legend{display:flex;gap:12px;font-size:11px;color:var(--m);font-weight:400}
.sec .legend i{font-style:normal;display:inline-flex;align-items:center;gap:4px}

.btn{height:27px;padding:0 12px;border-radius:3px;border:1px solid #d9dfeb;background:#fff;color:#5c6472;font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-d);color:#fff}
.btn.yellow{background:var(--yellow);border-color:var(--yellow);color:#fff}
.btn.yellow:hover{background:#b78300;color:#fff}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.green:hover{background:#2f915c;color:#fff}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{height:25px;padding:0 9px;font-size:11.5px}
.btn.lg{height:30px;padding:0 16px;font-size:12.5px}

.tag{display:inline-flex;align-items:center;justify-content:center;padding:1px 7px;border-radius:3px;font-size:11px;line-height:18px;white-space:nowrap}
.tag.gray{background:var(--gray-bg);color:var(--gray)}
.tag.blue{background:#eef1ff;color:var(--blue)}
.tag.purple{background:#f0edff;color:var(--purple)}
.tag.green{background:var(--green-bg);color:var(--green)}
.tag.red{background:var(--red-bg);color:var(--red)}
.tag.orange{background:var(--orange-bg);color:var(--orange)}
.tag.yellow{background:#fff5d9;color:var(--yellow)}
.tag.mini{font-size:10px;line-height:15px;padding:0 5px}

.filter{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;padding:12px 14px;border:1px solid var(--border);border-radius:3px;background:#fcfdff;margin-bottom:12px}
.fi{display:flex;align-items:center;gap:7px;white-space:nowrap}
.fi>label{font-size:12.5px;color:var(--t2);min-width:62px;text-align:right}
.inp,select.inp{height:29px;width:170px;padding:0 9px;border:1px solid #d9dfeb;border-radius:3px;background:#fff;color:var(--t)}
.inp::placeholder{color:#b3bac7}
.inp:focus{border-color:var(--blue)}
.inp.w120{width:120px}.inp.w200{width:200px}.inp.w90{width:90px}
.fi .range{display:flex;align-items:center;gap:5px}
.fi .range .inp{width:124px}
textarea.inp{height:auto;padding:7px 9px;resize:vertical;width:100%;line-height:1.6}
.suffix{height:29px;min-width:38px;padding:0 10px;background:var(--label);border:1px solid #d9dfeb;border-left:none;border-radius:0 3px 3px 0;display:flex;align-items:center;color:var(--m);font-size:12px}
.inp.has-sfx{border-radius:3px 0 0 3px}

.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.toolbar .sp{flex:1}
.toolbar .sum{font-size:12px;color:var(--m)}
.tabs-mini{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:12px;overflow:hidden}
.tabs-mini>div{padding:8px 17px;font-size:13px;color:var(--t2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs-mini>div:hover{color:var(--blue)}
.tabs-mini>div.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.tabs-mini>div em{font-style:normal;font-size:11px;color:var(--m);background:var(--gray-bg);padding:0 5px;border-radius:8px;margin-left:5px}
.tabs-mini>div.on em{background:var(--blue-l);color:var(--blue)}

.tbl-wrap{border:1px solid var(--border);border-radius:3px;overflow:hidden;width:100%}
table.tb{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12.5px}
table.tb th{background:var(--th);color:#4a5260;font-weight:600;height:38px;padding:0 8px;border-bottom:1px solid var(--border);text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.tb td{height:44px;padding:5px 8px;border-bottom:1px solid var(--line);color:#4a5260;vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;word-break:break-all}
table.tb tr:last-child td{border-bottom:none}
table.tb tbody tr:hover{background:#fafbff}
table.tb tbody tr.sel{background:#f0f3ff}
table.tb tbody tr.urgent{background:#fffafa}
table.tb td.c,table.tb th.c{text-align:center}
table.tb td.mono{font-variant-numeric:tabular-nums;color:var(--t)}
.cell-2{line-height:1.4;white-space:normal}
.cell-2 .l1{color:var(--t)}
.cell-2 .l2{font-size:11px;color:var(--m)}
.cell-act{display:flex;gap:5px;align-items:center;flex-wrap:nowrap}
.numlink{color:var(--blue);font-size:14px;font-weight:600;cursor:pointer}
.numlink.r{color:var(--red)}.numlink.o{color:var(--orange)}.numlink.g{color:var(--green)}
.light{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.light.g{background:var(--green)}.light.r{background:var(--red)}.light.o{background:var(--orange)}.light.b{background:var(--blue)}
.empty{padding:26px 12px;text-align:center;color:var(--m);font-size:12px}
.pager{display:flex;align-items:center;justify-content:flex-end;gap:7px;margin-top:11px;font-size:12px;color:var(--t2)}
.pager select{height:25px;border:1px solid var(--border);border-radius:3px;background:#fff;padding:0 4px}
.pager .pg{min-width:23px;height:23px;border:1px solid var(--border);border-radius:3px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;background:#fff;font-size:11px}
.pager .pg.on{background:var(--blue);border-color:var(--blue);color:#fff}
.pager .jump{width:38px;height:25px;border:1px solid var(--border);border-radius:3px;text-align:center}

.kv-grid{display:grid;grid-template-columns:110px 1fr 110px 1fr;border:1px solid var(--border);border-radius:3px;overflow:hidden;font-size:12.5px}
.kv-grid .k{background:var(--label);color:var(--t2);padding:9px 10px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);text-align:right;white-space:normal;line-height:1.45}
.kv-grid .v{padding:9px 11px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);color:var(--t);word-break:break-all}
.kv-grid .k:nth-child(4n),.kv-grid .v:nth-child(4n+4){border-right:none}
.kv-grid .span3{grid-column:span 3}
.kv-grid .req:before{content:"* ";color:var(--red)}
.kv-grid.two{grid-template-columns:110px 1fr}

.mask{position:fixed;inset:0;background:rgba(30,36,50,.45);z-index:80;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:64px 16px 28px}
.modal{background:#fff;border-radius:4px;box-shadow:0 10px 36px rgba(20,30,60,.2);max-width:100%;animation:pop .15s ease-out}
@keyframes pop{from{transform:translateY(-7px);opacity:.7}to{transform:none;opacity:1}}
.mhd{height:50px;display:flex;align-items:center;padding:0 20px}
.mhd h3{font-size:17px;font-weight:600}
.mhd .x{margin-left:auto;color:var(--m);font-size:20px;cursor:pointer;line-height:1}
.mhd .x:hover{color:var(--t)}
.mbd{padding:6px 20px 18px}
.mft{display:flex;justify-content:flex-end;gap:9px;padding:13px 20px;border-top:1px solid var(--border)}
.frow{display:flex;align-items:flex-start;gap:12px;margin-bottom:15px}
.frow>label{width:100px;flex:none;text-align:right;padding-top:6px;color:var(--t2);font-size:12.5px}
.frow>label.req:before{content:"* ";color:var(--red)}
.frow .fc{flex:1;min-width:0;display:flex;align-items:center}
.frow .inp{width:100%}
.frow .ro{background:var(--label);color:var(--t2)}
.form-sec{font-size:14px;font-weight:600;color:var(--t);margin:10px 0 14px;padding-left:9px;border-left:3px solid var(--blue)}
.pill{border:1px solid var(--blue);background:var(--blue-l);color:var(--blue);border-radius:3px;padding:3px 8px;font-size:12px;display:inline-flex;align-items:center;gap:7px}
.pill .x{cursor:pointer;opacity:.7}

.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:120;background:#fff;border:1px solid var(--border);border-left:3px solid var(--green);box-shadow:0 6px 22px rgba(20,30,60,.16);border-radius:4px;padding:9px 18px;font-size:12.5px;color:var(--t);display:flex;align-items:center;gap:8px}

.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:4px 0 6px}
.stat{border-radius:7px;padding:17px 20px;color:#fff;cursor:pointer;position:relative;overflow:hidden}
.stat.p1{background:linear-gradient(120deg,#6a5ae0,#8d7df0)}
.stat.p2{background:linear-gradient(120deg,#efa12b,#f5c25c)}
.stat.p3{background:linear-gradient(120deg,#e9675e,#ee8b83)}
.stat .sl{font-size:13px}
.stat .sn{font-size:30px;font-weight:700;line-height:1.4;font-variant-numeric:tabular-nums}
.stat .sf{font-size:11.5px;opacity:.9}
.stat .ar{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:22px;opacity:.55}

.detail-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.detail-head .back{width:28px;height:28px;border:1px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t2)}
.detail-head .back:hover{border-color:var(--blue);color:var(--blue)}
.detail-head .code{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.detail-blue{color:var(--blue);font-size:12.5px;margin-bottom:12px}
.proj-line{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:3px;padding:10px 14px;background:#fcfdff;margin-bottom:12px}
.proj-line .nm{font-size:15px;font-weight:600}
.proj-line .sp{flex:1}
.psteps{display:flex;align-items:center;border:1px solid var(--border);border-radius:3px;padding:10px 12px;margin-bottom:12px;background:#fff;overflow:hidden}
.pstep{display:flex;align-items:center;gap:6px;flex:1;min-width:0;cursor:pointer}
.pstep .pc{width:19px;height:19px;flex:none;border-radius:50%;border:1.5px solid #d5dbe8;color:var(--m);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700}
.pstep .pt{font-size:12px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pstep .pl{flex:1;height:1px;background:#e2e6ef;margin:0 8px;min-width:6px}
.pstep.done .pc{background:var(--green);border-color:var(--green);color:#fff}
.pstep.done .pt{color:var(--green)}
.pstep.now .pc{background:var(--blue);border-color:var(--blue);color:#fff}
.pstep.now .pt{color:var(--blue);font-weight:600}
.pflow{display:flex;align-items:flex-start;width:100%}
.pfnode{flex:1;min-width:0;text-align:center}
.pfbar{height:18px;display:flex;align-items:center;justify-content:center}
.pfl{flex:1;height:2px;min-width:3px;background:#e2e6ef}
.pfl.on{background:var(--green)}
.pfl.ghost{background:transparent}
.pfdot{width:16px;height:16px;flex:none;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;background:#d8dee9}
.pfnode.done .pfdot{background:var(--green)}
.pfnode.now .pfdot{background:#fff;border:2px solid var(--green)}
.pfnode.now .pfdot:after{content:"";width:6px;height:6px;border-radius:50%;background:var(--green)}
.pflb{font-size:11px;color:#9aa3b2;margin-top:4px;white-space:nowrap}
.pfnode.done .pflb,.pfnode.now .pflb{color:var(--green)}
.pfnode.now .pflb{font-weight:600}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo"><div class="logo-mark">工</div><span>工程管理系统</span><span class="logo-fold">☰</span></div>
    <div class="sb-scroll" id="sidebar"></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="crumb" id="crumb"></div>
      <div class="top-right">
        <span class="ico" data-act="open" data-key="home">🔍</span>
        <span class="ico" style="position:relative" data-act="open" data-key="todo">🔔<span class="dot-n" id="todoBadge">7</span></span>
        <span class="tri">JK</span><select class="inp" id="roleSel" style="width:136px;height:26px"><option>工程管理部</option><option>企业负责人</option><option>工程负责人</option></select>
      </div>
    </header>
    <div class="tabbar" id="tabbar"></div>
    <div class="content" id="content"></div>
  </div>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
const ICONS={
 home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>',
 folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
 list:'<path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/>',
 user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
 clip:'<path d="M21.4 11.1 12.3 20a5 5 0 0 1-7.1-7.1l9.2-9.2a3.5 3.5 0 0 1 5 5l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/>',
 img:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>',
 file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1-2 3.4-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V22h-4v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1-2-3.4.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H2v-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1 2-3.4.1.1a1.6 1.6 0 0 0 1.8.3 1.6 1.6 0 0 0 1-1.5V2h4v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1 2 3.4-.1.1a1.6 1.6 0 0 0-.3 1.8 1.6 1.6 0 0 0 1.5 1H22v4h-.1a1.6 1.6 0 0 0-1.5 1z"/>',
 board:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 17v-4M12 17V8M16 17v-6"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 check:'<path d="M20 6 9 17l-5-5"/>',
 bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/>',
 upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5M12 3v12"/>',
 arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 refresh:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
 back:'<path d="M19 12H5M11 18l-6-6 6-6"/>'
};

function riskOf(due,done){
  if(done)return {k:'已完成',c:'green',l:'g',d:0};
  const d=dayDiff(due);
  if(d<0)return {k:'逾期',c:'red',l:'r',d:d};
  if(d<=Number(S.remindDays))return {k:'临期',c:'orange',l:'o',d:d};
  return {k:'正常',c:'gray',l:'b',d:d};
}

function openPage(key,opt){
  if(!LABEL[key])key='home';
  closeModal();
  let t=S.tabs.find(x=>x.key===key);
  if(!t){
    while(S.tabs.filter(x=>!x.fixed).length>=3){
      const v=S.tabs.filter(x=>!x.fixed&&x.key!==S.active).sort((a,b)=>a.ts-b.ts)[0];
      if(!v)break;S.tabs=S.tabs.filter(x=>x!==v);
    }
    t={key:key,label:LABEL[key],ts:Date.now()};S.tabs.push(t);
  }
  t.ts=Date.now();S.active=key;S.page=key;
  if(opt&&opt.project){S.currentProject=opt.project;S.editingProject=opt.project;}else if(key==='projectNew'&&!opt){S.editingProject=null;}
  if(opt&&opt.proc)S.currentProc=Number(opt.proc);
  if(opt&&opt.filter)S.ledgerFilter=opt.filter;
  if(opt&&opt.boardFilter!==undefined)S.boardFilter=opt.boardFilter;
  if(opt&&opt.tab)S.detailTab=opt.tab;
  render();document.getElementById('content').scrollTop=0;
}

const PF_NODES=['谋划中','未开工','施工中','已完工'];
function projectReports(p){return S.planLedger.filter(t=>t.pid===p.id&&S.planReported.indexOf(t.id)>=0);}
function projectState(p){
  const pct=Number(p.pct)||0;
  if(pct>=100)return {n:'已完工',cur:4};
  if(pct>0||projectReports(p).length)return {n:'施工中',cur:2};
  return {n:'未开工',cur:1};
}
function projStageIdx(p){return projectState(p).cur;}
function stageFlow(p){
  const cur=projStageIdx(p);
  let h='<div class="pflow">';
  PF_NODES.forEach((n,j)=>{
    const cls=j<cur?'done':j===cur?'now':'';
    const left=j===0?'<i class="pfl ghost"></i>':'<i class="pfl'+(j<=cur?' on':'')+'"></i>';
    const right=j===PF_NODES.length-1?'<i class="pfl ghost"></i>':'<i class="pfl'+(j<cur?' on':'')+'"></i>';
    h+='<div class="pfnode '+cls+'"><div class="pfbar">'+left+'<span class="pfdot">'+(j<cur?'✓':'')+'</span>'+right+'</div><div class="pflb">'+n+'</div></div>';
  });
  return h+'</div>';
}

/* ---------- 进度计划详情：甘特图 / 表格 双视图 ---------- */
function planTaskState(x){
  if(x.pct>=100)return {n:'已完成',c:'green'};
  const today='2026-11-16';
  if(x.end<today)return {n:'已超时',c:'red'};
  if(x.start<=today)return {n:'进行中',c:'blue'};
  return {n:'未开始',c:'gray'};}
function renderPlanGantt(){
  const p=curProject();const mode=S.planView||'gantt';

  h+='<div class="detail-head"><div class="back" data-act="open" data-key="pplan">'+ic('back')+'</div>'+

    '<div style="margin-left:auto">'+B('导出','primary','toast','data-msg="已导出"')+'</div></div>';

  if(mode==='gantt'){
    const ts=tasks.map(x=>x.start).sort()[0]||'2025-01-01';

        '<i style="position:absolute;left:'+pc(x.start)+'%;width:'+Math.max(pc(x.end)-pc(x.start),1.5)+'%;top:2px;bottom:2px;background:'+bc+';border-radius:3px" title="'+x.task+'：'+st.n+'（'+x.start+' ~ '+x.end+'）"></i></div></td>'+
        '<td><div class="cell-act">'+B('查看','sm','open','data-key="planTask" data-project="'+p.id+'" data-task="'+x.id+'"')+'</div></td></tr>';
      }).join('')+
      '</tbody></table>';
  }else{
    const rows=tasks.map((x,i)=>{
      const st=planTaskState(x);
      return '<tr><td class="c mono">'+(i+1)+'</td><td>'+x.task+'</td><td class="mono">'+x.start+'</td><td class="mono">'+x.end+'</td>'+

      '<td>'+tag(st.n,st.c)+'</td><td>'+pctBar(x.pct)+'</td>'+
      '<td><div class="cell-act">'+B('查看','sm','open','data-key="planTask" data-project="'+p.id+'" data-task="'+x.id+'"')+'</div></td></tr>';
    }).join('');
    h+=tbl(['5%','15%','11%','11%','6%','9%','11%','9%','13%','10%'],

/* ---------- 进度计划模板编辑（三级任务树） ---------- */
const DEP_TYPES=['完成到开始（FS）','开始到开始（SS）','完成到完成（FF）','开始到完成（SF）'];
function tplTaskTree(t){
  if(t.tree)return t.tree;
  t.tree=t.tasks.map(n=>({n:n,pre:'否',preTask:'',dep:'',children:[]}));
  return t.tree;
}
function tplFlat(tree,out,depth,path){
  out=out||[];depth=depth||0;path=path||'';
  tree.forEach((x,i)=>{const p=path?path+'/' +i:String(i);out.push({x:x,depth:depth,path:p});
    if(x.children&&x.children.length)tplFlat(x.children,out,depth+1,p);});
  return out;
}
function tplNodeByPath(tree,path){
  if(!path)return null;
  const parts=path.split('/').map(Number);let arr=tree,node=null;
  parts.forEach(i=>{node=arr[i];arr=node.children;});
  return node;
}
function renderTplEdit(){
  const t=S.planTpl[S.tplEditIdx||0]||{n:'进度计划模板'};
  const tree=tplTaskTree(t);
  const ro=S.tplMode==='view';
  let h='<div class="page"><div class="page-hd"><div><h2>'+(ro?'查看进度计划模板':'修改进度计划模板')+'</h2></div>'+
    '<div class="right">'+B('返回','','open','data-key="tplPlan"')+(ro?'':B('保存','primary','tplEdit-save'))+'</div></div>';
  h+='<div class="card" style="margin-bottom:14px"><div class="kv4"><div class="kv-row" style="grid-column:span 2"><span class="k">模板名称</span>'+
    '<span class="v"><input class="inp" style="width:320px" value="'+esc(t.n)+'" readonly></span></div></div></div>';
  h+=sec('任务列表',ro?'':B('+ 新增一级任务','primary','modal','data-modal="tplTask" data-parent=""'));
  const flat=tplFlat(tree);
  const counters=[];
  const rows=flat.map(r=>{
    const lv=r.depth+1;
    counters[r.depth]=(counters[r.depth]||0)+1;counters.length=r.depth+1;
    const num=counters.slice(0,lv).join('.');
    const indent=lv>1?'<span style="display:inline-block;width:'+(r.depth*24)+'px"></span>':'';
    const nm=lv===1?'<b>'+esc(r.x.n)+'</b>':esc(r.x.n);
    let row='<tr><td class="c mono">'+num+'</td>'+
      '<td>'+indent+nm+'</td>'+
      '<td>'+(r.x.pre==='是'?esc(r.x.preTask||'—'):'—')+'</td>'+
      '<td>'+(r.x.pre==='是'?esc(r.x.dep||'—'):'—')+'</td>';
    if(!ro){
      const addBtn=lv<3?B('新增子任务','sm primary','modal','data-modal="tplTask" data-parent="'+r.path+'"'):'';
      row+='<td><div class="cell-act">'+addBtn+B('删除','sm red','tplTask-del','data-path="'+r.path+'"')+'</div></td>';
    }
    return row+'</tr>';
  }).join('');
  if(ro)h+=tbl(['8%','50%','21%','21%'],['序号','标题名称','前置任务','任务依赖关系类型'],rows||emptyRow('暂无任务'));
  else h+=tbl(['7%','41%','18%','18%','16%'],['序号','标题名称','前置任务','任务依赖关系类型','操作'],rows||emptyRow('暂无任务','+ 新增一级任务','modal','data-modal="tplTask" data-parent=""'));

}

const INV_CALS=[['pay','支付口径'],['ja','纳统-建安投资'],['sb','纳统-设备购置'],['qt','纳统-其他费用'],['cz','施工产值']];
const invNum=v=>{const n=parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n;};
const invFmt=n=>(Math.round(n*100)/100).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const invMonth=()=>S.invMonth||10;
const INV_CUR_YEAR=2026;
const INV_HIST_YEARS=[2024,2025];
function invReport(pid,year){
  year=year||INV_CUR_YEAR;
  S.invReports=S.invReports||{};
  let byYear=S.invReports[pid]=S.invReports[pid]||{};
  let r=byYear[year];
  if(!r){
    const p=S.projects.find(x=>x.id===pid)||{};
    if(year===INV_CUR_YEAR){
      r={type:p.type||'固定资产投资',stage:p.pct>=100?'已完工':(p.pct>0?'施工中':'未开工'),
        start:p.start||'',end:p.end||'',totalInvest:invNum(p.invest)/10000,contract:'',planInvest:'',natStat:'是',
        leader:p.leader&&p.leader!=='—'?p.leader:'',filler:'',auditor:'',remark:'',
        prior:{pay:'',ja:'',sb:'',qt:'',cz:''},months:{},st:'待填报'};
      INV_CALS.forEach(c=>{r.months[c[0]]=Array(12).fill('');});
    }else{
      const base=3000+Math.floor(Math.random()*8000);
      r={type:p.type||'固定资产投资',stage:year<INV_CUR_YEAR?'已完工':(p.pct>0?'施工中':'未开工'),
        start:p.start||'',end:p.end||'',totalInvest:invNum(p.invest)/10000,contract:'',planInvest:String(base),
        natStat:'是',leader:p.leader&&p.leader!=='—'?p.leader:'',filler:p.leader&&p.leader!=='—'?p.leader:'',auditor:'企业负责人',remark:'',
        prior:{pay:String(Math.round(base*0.6)),ja:String(Math.round(base*0.3)),sb:String(Math.round(base*0.1)),qt:String(Math.round(base*0.05)),cz:''},
        months:{},st:'已通过'};
      INV_CALS.forEach(c=>{r.months[c[0]]=Array(12).fill(0).map((_,i)=>i<10?String(Math.round(base/12*(0.8+Math.random()*0.4))):'');});
    }
    byYear[year]=r;
  }
  return r;
}
function invYearsOf(pid){
  const ys=[INV_CUR_YEAR].concat(INV_HIST_YEARS.filter(y=>y<INV_CUR_YEAR));
  return ys.sort((a,b)=>b-a);
}
function invSum(a,n){let s=0;for(let i=0;i<(n||12)&&i<12;i++)s+=invNum(a&&a[i]);return s;}
function invCalc(r){
  const cm=invMonth(),o={};
  let ntY=0,ntM=0,ntP=0;
  INV_CALS.forEach(c=>{const k=c[0],arr=r.months[k]||[];
    const year=invSum(arr,12),ytd=invSum(arr,cm),prior=invNum(r.prior[k]);
    o[k]={year:year,ytd:ytd,start:ytd+prior};
    if(k==='ja'||k==='sb'||k==='qt'){ntY+=year;ntM+=ytd;ntP+=prior;}});
  o.nt={year:ntY,ytd:ntM,start:ntM+ntP};
  o.rate=invNum(r.planInvest)>0?Math.round(o.pay.ytd/invNum(r.planInvest)*100):0;
  return o;
}

function invCollect(pid){

  r.auditor=S.form.ivAuditor!==undefined?S.form.ivAuditor:r.auditor;

/* ---------- 事件委托 ---------- */
document.addEventListener('click',function(e){

  }
  if(a==='reset'){S.form={};S.filters={};toast('已重置');render();return;}
  if(a==='tab'){openPage(t.dataset.key);return;}
  if(a==='submit'){
    const kind=t.dataset.kind;
    collectForm();
    if(kind==='saveProject'){
      const id=S.editingProject||('TZ-P'+String(Date.now()).slice(-12));
      const isNew=!S.editingProject;
      if(isNew){
        S.projects.unshift({id:id,name:S.form.pname||'新建工程项目',co:S.form.co||S.projects[0].co,src:'手动新增',type:S.form.ptype||'房地产开发项目',prog:'未开工',pct:0,
          leader:S.form.pengineer&&S.form.pengineer!=='—'?S.form.pengineer:'—',py:'—',tel:'—',org:S.form.co||S.projects[0].co,
          start:S.form.pstart||'2026-11-01',end:S.form.pend||'2027-12-31',days:S.form.pdays||'365',invest:S.form.ptotal||'0.00 元',
          unitState:'待配置',leaderState:'待配置',stage:'待新增单位工程',total:0,done:0,over:0,soon:0});
        S.editingProject=id;S.currentProject=id;
      }else{
        const p=S.projects.find(x=>x.id===S.editingProject);
        if(p){
          p.name=S.form.pname||p.name;p.co=S.form.co||p.co;p.type=S.form.ptype||p.type;
          p.start=S.form.pstart||p.start;p.end=S.form.pend||p.end;p.days=S.form.pdays||p.days;
          p.invest=S.form.ptotal||p.invest;p.prog=projectState(p).n;
          if(S.form.pengineer&&S.form.pengineer!=='—'){p.leader=S.form.pengineer;}
        }
      }
      S.form={};toast('保存成功');
      openPage('detail',{project:id,tab:'项目基本信息'});
    }
    return;
  }
  if(a==='open'){
    const opt={};
    if(t.dataset.project)opt.project=t.dataset.project;
    if(t.dataset.proc)opt.proc=t.dataset.proc;
    if(t.dataset.filter)opt.filter=t.dataset.filter;
    if(t.dataset.boardFilter!==undefined)opt.boardFilter=t.dataset.boardFilter;
    if(t.dataset.tab)opt.tab=t.dataset.tab;
    if(t.dataset.unit!==undefined){S.form.preUnit=Number(t.dataset.unit);S.cbUnits=[];S.cbTpls=[];}
    else if(t.dataset.key==='importProc'){S.form.preUnit=0;S.cbUnits=[];S.cbTpls=[];}
    if(t.dataset.task)S.planTask=t.dataset.task;
    if(t.dataset.tpl!==undefined)S.tplEditIdx=Number(t.dataset.tpl);
    if(t.dataset.mode!==undefined)S.tplMode=t.dataset.mode;
    if(t.dataset.invmode!==undefined){S.invMode=t.dataset.invmode;S.invGridEdit=false;S.form={};S.invFromHistory=false;}
    if(t.dataset.invyear!==undefined){S.invYear=Number(t.dataset.invyear);S.invMode='view';S.invGridEdit=false;S.form={};S.invFromHistory=true;}else if(t.dataset.key==='investFill'){S.invFromHistory=false;}
    else if(t.dataset.key!=='investFill'){S.invYear=null;S.invFromHistory=false;}
    openPage(t.dataset.key,opt);return;
  }
  if(a==='remind-step'){
    const f=t.dataset.f,d=Number(t.dataset.d);
    const cur=Number(S.form[f]||S[f.replace('Days','')+'RemindDays']||(f.indexOf('Proc')>=0?1:3));
    const nv=Math.max(1,Math.min(99,cur+d));
    S.form[f]=nv;
    const inp=document.querySelector('[data-f="'+f+'"]');
    if(inp)inp.value=nv;
    return;
  }
  if(a==='apply-revoke'){

    return;
  }
  if(a==='apply-resubmit'){
    const ap=S.approvals.find(x=>x.id===Number(t.dataset.ap));

      const p=S.projects.find(x=>x.id===ap.pid);

  if(a==='inv-save'){

    r.st='已填报';S.form={};S.invGridEdit=false;

  }
  if(a==='tplTask-del'){
    const tree=tplTaskTree(S.planTpl[S.tplEditIdx||0]);
    const parts=t.dataset.path.split('/').map(Number);
    const idx=parts.pop();
    let arr=tree;parts.forEach(i=>{arr=arr[i].children;});
    arr.splice(idx,1);render();toast('已删除');return;
  }
  if(a==='tplEdit-save'){
    const t=S.planTpl[S.tplEditIdx||0];
    if(t){t.tasks=tplFlat(tplTaskTree(t)).map(r=>r.x.n);}
    render();toast('模板已保存');return;
  }
  if(a==='pick-add'){S.pickList=S.pickList||[];if(S.pickList.indexOf(t.dataset.v)<0)S.pickList.push(t.dataset.v);MODALS.pickPerson();return;}
  if(a==='pick-del'){S.pickList=(S.pickList||[]).filter(n=>n!==t.dataset.v);MODALS.pickPerson();return;}
  if(a==='pick-ok'){const f=t.dataset.f,inp=document.querySelector('[data-f="'+f+'"]');if(inp)inp.value=(S.pickList||[]).join('、');closeModal();return;}
  if(a==='pick-co'){const f=S.pickTarget,inp=document.querySelector('[data-f="'+f+'"]');if(inp)inp.value=t.dataset.v;closeModal();return;}
  if(a==='pick-tpl-ok'){closeModal();render();return;}
  if(a==='modal'){
    S.pickTarget=t.dataset.target||'';S.pickList=[];
    if(t.dataset.project)S.project=t.dataset.project;
    if(t.dataset.modal==='tplTask'){S.tplTaskParent=t.dataset.parent||'';S.form.ttName='';S.form.ttHasPre='否';S.form.ttPreTask='';S.form.ttDep='';}
    if(t.dataset.proc)S.currentProc=Number(t.dataset.proc);
    if(t.dataset.plan)S.currentPlan=Number(t.dataset.plan);
    if(t.dataset.ap)S.currentApproval=Number(t.dataset.ap);
    if(t.dataset.i!==undefined)S.tplIndex=Number(t.dataset.i);
    if(t.dataset.tpl!==undefined)S.cbPlanTpl=Number(t.dataset.tpl);
    if(t.dataset.unit!==undefined)S.form.preUnit=Number(t.dataset.unit);
    else S.form.preUnit=0;
    const f=MODALS[t.dataset.modal];if(f)f();return;
  }
  if(a==='work-filter'){S.workFilter=t.dataset.v;render();return;}
  if(a==='proj-filter'){S.projFilter=t.dataset.v;render();return;}
  if(a==='ledger-filter'){S.ledgerFilter=t.dataset.v;render();return;}
  if(a==='board-filter'){S.boardFilter=t.dataset.v;render();return;}
  if(a==='myfill-filter'){S.myfillFilter=t.dataset.v;render();return;}
  if(a==='todo-filter'){S.todoFilter=t.dataset.v;render();return;}
  if(a==='detail-tab'){S.detailTab=t.dataset.v;render();return;}
  if(a==='plan-mode'){S.planView=t.dataset.v;render();return;}
  if(a==='projectNew-tab'){S.projectNewTab=t.dataset.v;render();return;}
  if(a==='save-rule-modal'){MODALS.rule();toast('已保存，预警口径已更新');return;}
  if(a==='modal-submit'){
    const k=t.dataset.kind;closeModal();
    if(k==='newProject'){
      const nm=S.form.pname||'新建工程项目';
      if(S.editingProject){
        const p=S.projects.find(x=>x.id===S.editingProject);
        if(p){p.name=nm;p.co=S.form.co||p.co;p.type=S.form.ptype||p.type;p.start=S.form.pstart||p.start;p.end=S.form.pend||p.end;p.days=S.form.pdays||p.days;p.invest=S.form.ptotal||p.invest;p.projSt='审批中';p.stage='待审核';
          S.approvals.unshift({id:Date.now(),pid:p.id,pname:nm,node:'二级公司工程部负责人审核',submit:new Date().toISOString().slice(0,16).replace('T',' '),by:S.role,type:'项目新增',st:'待审核'});}
        S.editingProject=null;
      }else{
        const id='TZ-P'+String(Date.now()).slice(-12);
        S.projects.unshift({id:id,name:nm,co:S.form.co||S.projects[0].co,src:'手动新增',type:S.form.ptype||'房地产开发项目',prog:'未开工',pct:0,
          leader:'—',py:'—',tel:'—',org:S.form.co||S.projects[0].co,start:S.form.pstart||'2026-11-01',end:S.form.pend||'2027-12-31',days:S.form.pdays||'365',invest:S.form.ptotal||'0.00 元',
          projSt:'审批中',unitState:'待配置',leaderState:'待配置',stage:'待审核',total:0,done:0,over:0,soon:0});
        S.approvals.unshift({id:Date.now(),pid:id,pname:nm,node:'二级公司工程部负责人审核',submit:new Date().toISOString().slice(0,16).replace('T',' '),by:S.role,type:'项目新增',st:'待审核'});
      }
      S.form={};openPage('list');toast('已提交审核，审核通过后可配置工程负责人/单位工程/手续/进度计划');
    }else if(k==='draftProject'){
      const nm=S.form.pname||'新建工程项目';

      }else{
        const id='TZ-P'+String(Date.now()).slice(-12);
        S.projects.unshift({id:id,name:nm,co:S.form.co||S.projects[0].co,src:'手动新增',type:S.form.ptype||'房地产开发项目',prog:'未开工',pct:0,
          leader:'—',py:'—',tel:'—',org:S.form.co||S.projects[0].co,start:S.form.pstart||'2026-11-01',end:S.form.pend||'2027-12-31',days:S.form.pdays||'365',invest:S.form.ptotal||'0.00 元',
          projSt:'待提交',unitState:'待配置',leaderState:'待配置',stage:'待提交',total:0,done:0,over:0,soon:0});
      }
      S.editingProject=null;S.form={};openPage('list');toast('已暂存，审核状态：待提交');
    }else if(k==='editProject'){
      const p=curProject();
      p.name=S.form.pname||p.name;p.co=S.form.co||p.co;p.type=S.form.ptype||p.type;
      p.start=S.form.pstart||p.start;p.end=S.form.pend||p.end;p.days=S.form.pdays||p.days;
      p.invest=S.form.ptotal||p.invest;p.prog=projectState(p).n;

      S.units.push({u:Date.now(),pid:p.id,name:S.form.unitName||'新增单位工程',land:S.form.unitLand||'0.00',build:S.form.unitBuild||'0.00',cnt:0});

      S.approvals.unshift({id:Date.now(),pid:p.id,pname:p.name,node:'企业负责人审核',submit:'2026-11-13 10:20',by:'adminN',type:'负责人配置',st:'待审核'});

      const a=S.approvals.find(x=>x.id===S.currentApproval);
      const res=S.form.apResult||'通过';
      if(a){a.st=res==='通过'?'已通过':'已退回';
        const p=S.projects.find(x=>x.id===a.pid);
        if(p){
          if(a.type==='项目新增'){p.projSt=res==='通过'?'已通过':'已驳回';if(res==='通过'&&p.stage==='待审核')p.stage='待配置工程负责人';}
          else if(a.type==='手续配置'){S.units.filter(u=>u.pid===p.id&&u.cfgSt==='审批中').forEach(u=>{u.cfgSt=res==='通过'?'已生效':'已驳回';});}
          else if(a.type==='进度配置'){p.planCfgSt=res==='通过'?'已生效':'已驳回';}
          else if(a.type==='进度填报'){
            if(res==='通过'){
              const x=S.planLedger.find(z=>z.id===a.planId);
              if(x){x.pct=Math.min(100,Math.max(0,a.pfPct||x.pct));if(S.planReported.indexOf(x.id)<0)S.planReported.push(x.id);

    }else if(k==='tplPlan'){
      const arr=(S.form.ptTasks||'').split(/\n+/).filter(x=>x.trim());
      S.planTpl.push({n:S.form.ptName||'新增进度计划模板',tasks:arr.length?arr:['新建任务'],used:0});
      S.form={};render();toast('模板已保存');
    }else if(k==='fill'){
      if(S.reported.indexOf(S.currentProc)<0)S.reported.push(S.currentProc);
      const nx=S.procLedger.find(x=>S.reported.indexOf(x.id)<0);
      if(nx){S.currentProc=nx.id;MODALS.fill();toast('提交成功');}
      else{openPage('pledger',{filter:'已上报'});toast('提交成功');}
    }else if(k==='planFill'){
      const x=S.planLedger.find(p=>p.id===S.currentPlan);
      if(x){
        const pct=Math.min(100,Math.max(0,Number(S.form.pfPct)||x.pct));
        x.fillSt='审批中';x._pfPct=pct;
        const p=projOf(x);
        S.approvals.unshift({id:Date.now(),pid:p.id,pname:p.name,node:'二级公司工程部负责人审核',submit:new Date().toISOString().slice(0,16).replace('T',' '),by:S.role,type:'进度填报',st:'待审核',planId:x.id,pfPct:pct});
        render();toast('已提交审核，审核通过后进度将回写');
      }
    }
    return;
  }
});
const collectForm=function(){
  document.querySelectorAll('[data-f]').forEach(function(el){
    if(el.offsetParent!==null||el.type==='hidden')S.form[el.dataset.f]=el.value;
  });
};
document.addEventListener('input',function(e){
  const f=e.target.dataset.f;if(!f)return;
  S.form[f]=e.target.value;
  if(f==='remindDays')S.remindDays=e.target.value;
  if(f==='planTpl')S.cbPlanTpl=Number(e.target.value);
  if(e.target.dataset.auto==='pdays'){
    const s=S.form.pstart,e=S.form.pend;
    if(s&&e){
      const d=Math.round((new Date(e+'T00:00:00')-new Date(s+'T00:00:00'))/86400000);
      const inp=document.querySelector('[data-f="pdays"]');
      if(inp)inp.value=d>0?d+' 天':'';
    }
  }
});
document.addEventListener('change',function(e){
  const flt=e.target.dataset.flt;
  if(flt!==undefined){S.filters[flt]=e.target.value;render();return;}
  if(e.target.id==='roleSel'){
    S.role=e.target.value;S.page='home';S.active='home';S.tabs=[{key:'home',label:'首页',fixed:true,ts:Date.now()}];
    S.filters={};render();return;
  }
  const f=e.target.dataset.f;
  if(f){S.form[f]=e.target.value;}
  if(f==='remindOverdue'){S.remindOverdue=e.target.value;return;}
  if(f==='apResult'){S.form.apResult=e.target.value;return;}
  if(f==='ttHasPre'){MODALS.tplTask();return;}
  if(f==='invMonthSel'){S.invMonth=Number(e.target.value);render();return;}
  if(f&&f.indexOf('imp')===0){S.form[f]=e.target.value;return;}
  const cb=e.target.dataset.cb;
  if(cb==='unit'){const u=Number(e.target.dataset.u),a=S.cbUnits;
    if(e.target.checked){if(a.indexOf(u)<0)a.push(u);}else{const i=a.indexOf(u);if(i>=0)a.splice(i,1);}}
  if(cb==='tpl'){const i=Number(e.target.dataset.i),a=S.cbTpls;
    if(e.target.checked){if(a.indexOf(i)<0)a.push(i);}else{const j=a.indexOf(i);if(j>=0)a.splice(j,1);}}
});
render();
</script>
